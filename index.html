function createPlayer(index, name, isBot, colorOverride) {
  // Spawn at random position inside arena
  let x, y;
  const margin = CONFIG.PLAYER_START_RADIUS + 3;
  do {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * (R - margin);
    x = CX + Math.cos(angle) * dist;
    y = CY + Math.sin(angle) * dist;
  } while (!isInArena(Math.floor(x), Math.floor(y)));

  x = Math.floor(x); y = Math.floor(y);

  const cIdx = colorOverride !== undefined ? colorOverride : index;
  const p = {
    index, id: index + 1, name, isBot,
    color: CONFIG.COLORS[cIdx % CONFIG.COLORS.length],
    x, y,
    cx: x, cy: y,
    angle: Math.random() * Math.PI * 2,
    speed: isBot ? CONFIG.BOT_SPEED_MIN + Math.random() * (CONFIG.BOT_SPEED_MAX - CONFIG.BOT_SPEED_MIN) : CONFIG.PLAYER_SPEED * UPGRADES.find(u => u.id === 'speed').effect(getUpgradeLevel('speed')),
    trail: [],       // [[cx,cy], ...] grid cells for game logic
    trailPts: [],     // [{x,y}, ...] continuous positions for smooth rendering
    trailSet: new Set(),
    alive: true,
    respawnTimer: 0,
    territoryCount: 0,
    kills: 0,
    // Bot AI
    aiState: 'onTerritory',
    aiCellCount: 0,
    outwardDist: 8,
    lateralDist: 8,
    turnDir: 1,
    targetAngle: 0,
  };

  const startR = isBot ? CONFIG.PLAYER_START_RADIUS : UPGRADES.find(u => u.id === 'territory').effect(getUpgradeLevel('territory'));
  stampTerritory(p, x, y, startR);
  return p;
}

function stampTerritory(p, cx, cy, radius) {
  const r2 = radius * radius;
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      if (dx*dx + dy*dy <= r2) {
        const gx = cx + dx, gy = cy + dy;
        if (inBounds(gx, gy) && isInArena(gx, gy)) setCell(gx, gy, p.id);
      }
    }
  }
  terDirty = true;
}

// ============================================================
// TERRITORY CAPTURE (flood fill)
// ============================================================
function captureTerritory(p) {
  if (p.trail.length < 2) { p.trail = []; p.trailPts = []; p.trailSet.clear(); return; }

  const oid = p.id;

  // Trail cells become territory
  for (const [tx,ty] of p.trail) {
    if (inBounds(tx,ty) && isInArena(tx,ty)) setCell(tx, ty, oid);
  }

  // Bounding box of player's territory
  let minX = W, minY = W, maxX = 0, maxY = 0;
  for (let y = 0; y < W; y++) {
    for (let x = 0; x < W; x++) {
      if (getCell(x,y) === oid) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  minX = Math.max(0, minX-1); minY = Math.max(0, minY-1);
  maxX = Math.min(W-1, maxX+1); maxY = Math.min(W-1, maxY+1);

  const w = maxX - minX + 1, h = maxY - minY + 1;
  const outside = new Uint8Array(w * h);
  const queue = [];

  // Seed edges of bounding box
  for (let x = minX; x <= maxX; x++) {
    for (const y of [minY, maxY]) {
      const v = getCell(x,y);
      if (v !== oid && v !== -1) {
        const lx = x-minX, ly = y-minY;
        if (!outside[ly*w+lx]) { outside[ly*w+lx] = 1; queue.push(lx, ly); }
      }
    }
  }
  for (let y = minY+1; y < maxY; y++) {
    for (const x of [minX, maxX]) {
      const v = getCell(x,y);
      if (v !== oid && v !== -1) {
        const lx = x-minX, ly = y-minY;
        if (!outside[ly*w+lx]) { outside[ly*w+lx] = 1; queue.push(lx, ly); }
      }
    }
  }

  // BFS
  let qi = 0;
  while (qi < queue.length) {
    const lx = queue[qi++], ly = queue[qi++];
    for (const [nx,ny] of [[lx-1,ly],[lx+1,ly],[lx,ly-1],[lx,ly+1]]) {
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      if (outside[ny*w+nx]) continue;
      const gx = nx+minX, gy = ny+minY;
      const v = getCell(gx, gy);
      if (v === oid || v === -1) continue; // territory or wall blocks flood
      outside[ny*w+nx] = 1;
      queue.push(nx, ny);
    }
  }

  // Fill enclosed + count new cells
  let gained = 0;
  for (let ly = 0; ly < h; ly++) {
    for (let lx = 0; lx < w; lx++) {
      if (!outside[ly*w+lx]) {
        const gx = lx+minX, gy = ly+minY;
        if (getCell(gx,gy) !== oid && getCell(gx,gy) !== -1) { setCell(gx, gy, oid); gained++; }
      }
    }
  }

  // Coin reward for territory capture (human only) — capture upgrade adds bonus
  if (!p.isBot && gained > 0) {
    const captureBonus = UPGRADES.find(u => u.id === 'capture').effect(getUpgradeLevel('capture'));
    const reward = Math.max(2, Math.floor(gained / 3)) + captureBonus;
    addCoins(reward);
  }

  p.trail = []; p.trailPts = []; p.trailSet.clear();
  terDirty = true;
}

function countTerritory() {
  const counts = new Array(players.length).fill(0);
  let total = 0;
  for (let i = 0; i < W*W; i++) {
    if (grid[i] === -1) continue;
    total++;
    const v = grid[i];
    if (v > 0 && v <= players.length) counts[v-1]++;
  }
  for (let i = 0; i < players.length; i++) players[i].territoryCount = counts[i];
  return total;
}

// ============================================================
// KILL / RESPAWN
// ============================================================
function killPlayer(victim, killer) {
  victim.alive = false;
  // Clear trail
  victim.trail = []; victim.trailPts = []; victim.trailSet.clear();

  if (killer && killer !== victim) {
    killer.kills++;
    const victimId = victim.id, killerId = killer.id;
    // Transfer some territory
    if (CONFIG.KILL_REWARD > 0) {
      let transferred = 0;
      const max = Math.floor(victim.territoryCount * CONFIG.KILL_REWARD);
      for (let i = 0; i < W*W && transferred < max; i++) {
        if (grid[i] === victimId) { grid[i] = killerId; transferred++; }
      }
    }
    // Clear rest
    for (let i = 0; i < W*W; i++) { if (grid[i] === victimId) grid[i] = 0; }

    // Kill notification + coins (magnet upgrade multiplies)
    if (!killer.isBot) {
      addKillNotif(`Eliminated ${victim.name}!`);
      const magnetMult = UPGRADES.find(u => u.id === 'magnet').effect(getUpgradeLevel('magnet'));
      addCoins(Math.floor(30 * magnetMult));
    } else if (!victim.isBot) {
      addKillNotif(`Eliminated by ${killer.name}`);
    }
  } else {
    // Self-kill or border kill
    const victimId = victim.id;
    for (let i = 0; i < W*W; i++) { if (grid[i] === victimId) grid[i] = 0; }
    if (!victim.isBot) addKillNotif('You died!');
  }

  victim.respawnTimer = victim.isBot ? CONFIG.BOT_RESPAWN_DELAY : 0;
  terDirty = true;
}

function respawnPlayer(p) {
  let x, y;
  const startR = p.isBot ? CONFIG.PLAYER_START_RADIUS : UPGRADES.find(u => u.id === 'territory').effect(getUpgradeLevel('territory'));
  const margin = startR + 3;
  do {
    const a = Math.random() * Math.PI * 2;
    const d = Math.random() * (R - margin);
    x = Math.floor(CX + Math.cos(a) * d);
    y = Math.floor(CY + Math.sin(a) * d);
  } while (!isInArena(x, y));
  p.x = x; p.y = y; p.cx = x; p.cy = y;
  p.angle = Math.random() * Math.PI * 2;
  p.alive = true;
  p.trail = []; p.trailPts = []; p.trailSet.clear();
  p.aiState = 'onTerritory'; p.aiCellCount = 0;
  stampTerritory(p, x, y, startR);
  // Armor upgrade — brief invincibility on respawn for human
  if (!p.isBot) {
    const armorSec = UPGRADES.find(u => u.id === 'armor').effect(getUpgradeLevel('armor'));
    if (armorSec > 0) {
      p._invincible = armorSec;
    }
  }
}

// ============================================================
// KILL NOTIFICATIONS
// ============================================================
function addKillNotif(text) {
  const el = document.createElement('div');
  el.className = 'kill-notif';
  el.textContent = text;
  document.getElementById('kill-feed').appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// ============================================================
// BOT AI — rectangular loop pattern
// ============================================================
function updateBotAI(bot, dt) {
  if (!bot.alive) return;

  // Smooth angle toward target
  bot.angle = lerpAngle(bot.angle, bot.targetAngle, 8 * dt);

  const onOwn = isOwn(bot, bot.cx, bot.cy);

  switch (bot.aiState) {
    case 'onTerritory':
      if (!onOwn && bot.trail.length > 0) {
        // Just left territory — start outward phase
        bot.aiState = 'outward';
        bot.aiCellCount = 0;
        bot.outwardDist = CONFIG.BOT_OUTWARD_MIN + Math.floor(Math.random() * (CONFIG.BOT_OUTWARD_MAX - CONFIG.BOT_OUTWARD_MIN));
        bot.lateralDist = CONFIG.BOT_LATERAL_MIN + Math.floor(Math.random() * (CONFIG.BOT_LATERAL_MAX - CONFIG.BOT_LATERAL_MIN));
        bot.turnDir = Math.random() > 0.5 ? 1 : -1;
      } else {
        // Head outward from territory
        bot.targetAngle = bot.angle + (Math.random() - 0.5) * 0.3;
      }
      break;

    case 'outward':
      if (bot.aiCellCount >= bot.outwardDist) {
        bot.aiState = 'lateral';
        bot.aiCellCount = 0;
        bot.targetAngle = bot.angle + bot.turnDir * Math.PI / 2;
      }
      break;

    case 'lateral':
      if (bot.aiCellCount >= bot.lateralDist) {
        bot.aiState = 'returning';
        bot.aiCellCount = 0;
        const t = findNearestTerritory(bot);
        if (t) bot.targetAngle = Math.atan2(t.y - bot.y, t.x - bot.x);
      }
      break;

    case 'returning':
      if (bot.aiCellCount % 2 === 0) {
        const t = findNearestTerritory(bot);
        if (t) bot.targetAngle = Math.atan2(t.y - bot.y, t.x - bot.x);
      }
      if (onOwn) {
        bot.aiState = 'onTerritory';
        bot.aiCellCount = 0;
      }
      // Safety: if trail is very long, keep heading home
      if (bot.trail.length > 40) {
        const t = findNearestTerritory(bot);
        if (t) bot.targetAngle = Math.atan2(t.y - bot.y, t.x - bot.x);
      }
      break;
  }

  // Avoid arena boundary
  const dx = bot.x - CX, dy = bot.y - CY;
  const distFromCenter = Math.sqrt(dx*dx + dy*dy);
  if (distFromCenter > R - 5) {
    // Steer toward center
    const toCenter = Math.atan2(CY - bot.y, CX - bot.x);
    bot.targetAngle = lerpAngle(bot.targetAngle, toCenter, 0.5);
  }
}

function findNearestTerritory(p) {
  const oid = p.id;
  let best = null, bestD = Infinity;
  for (let y = 0; y < W; y += 2) {
    for (let x = 0; x < W; x += 2) {
      if (getCell(x,y) === oid) {
        const d = distSq(x, y, p.cx, p.cy);
        if (d < bestD) { bestD = d; best = { x, y }; }
      }
    }
  }
  return best;
}

// ============================================================
// INPUT
// ============================================================
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

let mouseX = CONFIG.CANVAS_WIDTH / 2;
let mouseY = CONFIG.CANVAS_HEIGHT / 2 - 100;
let mouseActive = false;

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (CONFIG.CANVAS_WIDTH / rect.width);
  mouseY = (e.clientY - rect.top) * (CONFIG.CANVAS_HEIGHT / rect.height);
  mouseActive = true;
});
canvas.addEventListener('mouseleave', () => { mouseActive = false; });

// Joystick
const joystickBase = document.getElementById('joystick-base');
const joystickKnob = document.getElementById('joystick-knob');
let joystickActive = false;
let joystickAngle = 0;
let joystickCenter = { x: 0, y: 0 };
const JOY_RADIUS = 58;
const JOY_DEADZONE = 6;

function getJoyCenter() {
  const r = joystickBase.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

function handleJoyMove(cx, cy) {
  const dx = cx - joystickCenter.x, dy = cy - joystickCenter.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const clamped = Math.min(dist, JOY_RADIUS);
  const a = Math.atan2(dy, dx);
  joystickKnob.style.transform = `translate(calc(-50% + ${Math.cos(a)*clamped}px), calc(-50% + ${Math.sin(a)*clamped}px))`;
  if (dist > JOY_DEADZONE) { joystickAngle = a; joystickActive = true; }
}

function resetJoy() {
  joystickKnob.style.transform = 'translate(-50%, -50%)';
  joystickActive = false;
}

joystickBase.addEventListener('mousedown', e => { e.preventDefault(); joystickCenter = getJoyCenter(); handleJoyMove(e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { if (joystickActive) handleJoyMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (joystickActive) resetJoy(); });
joystickBase.addEventListener('touchstart', e => { e.preventDefault(); joystickCenter = getJoyCenter(); handleJoyMove(e.touches[0].clientX, e.touches[0].clientY); });
window.addEventListener('touchmove', e => { if (!joystickActive) return; e.preventDefault(); handleJoyMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
window.addEventListener('touchend', () => { if (joystickActive) resetJoy(); });

function getPlayerAngle(human) {
  // Priority: joystick > keyboard > mouse
  if (joystickActive) return joystickAngle;

  let kx = 0, ky = 0;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) kx += 1;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) kx -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) ky += 1;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) ky -= 1;
  if (kx !== 0 || ky !== 0) return Math.atan2(ky, kx);

  if (mouseActive) {
    const dx = mouseX - CONFIG.CANVAS_WIDTH / 2;
    const dy = mouseY - CONFIG.CANVAS_HEIGHT / 2;
    if (Math.abs(dx) + Math.abs(dy) > 8) return Math.atan2(dy, dx);
  }

  return null;
}

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  const human = players[0];

  // Armor invincibility countdown
  if (human && human._invincible > 0) {
    human._invincible -= dt;
    if (human._invincible <= 0) human._invincible = 0;
  }

  // Survival time tracking
  if (human && human.alive) roundSurvivalTime += dt;

  // Passive territory income — earn coins for holding territory (every 5 seconds)
  if (human && human.alive) {
    if (!this._lastIncomeTime) this._lastIncomeTime = 0;
    this._lastIncomeTime += dt;
    if (this._lastIncomeTime >= 5) {
      this._lastIncomeTime = 0;
      const arenaArea = countArenaArea();
      const pctHeld = arenaArea > 0 ? (human.territoryCount / arenaArea) * 100 : 0;
      const planetIncome = getColonizedPlanetIncome();
      const income = Math.floor(pctHeld * 0.5) + planetIncome; // territory + planet income
      if (income > 0) addCoins(income);
    }
  }

  // Human direction
  if (human && human.alive) {
    const a = getPlayerAngle(human);
    if (a !== null) human.angle = a;
  }

  for (const p of players) {
    if (!p.alive) {
      if (p.isBot) {
        p.respawnTimer -= dt * 1000;
        if (p.respawnTimer <= 0) respawnPlayer(p);
      }
      continue;
    }

    if (p.isBot) updateBotAI(p, dt);

    // Save previous cell
    const prevCX = p.cx, prevCY = p.cy;

    // Move
    p.x += Math.cos(p.angle) * p.speed * dt;
    p.y += Math.sin(p.angle) * p.speed * dt;

    // Clamp to arena (slide along boundary, no death)
    clampToArena(p);

    const newCX = Math.floor(p.x), newCY = Math.floor(p.y);

    // Entered new cell?
    if (newCX !== prevCX || newCY !== prevCY) {
      p.cx = newCX; p.cy = newCY;

      if (!inBounds(p.cx, p.cy) || !isInArena(p.cx, p.cy)) continue;

      // Handle diagonal: ensure 4-connected trail
      if (newCX !== prevCX && newCY !== prevCY) {
        processCell(p, newCX, prevCY); // intermediate cell
      }
      processCell(p, p.cx, p.cy);

      if (p.isBot) p.aiCellCount++;
    }

    // Always record continuous position for smooth trail rendering
    if (p.trail.length > 0) {
      p.trailPts.push({ x: p.x, y: p.y });
    }
  }

  // Abilities & map objects
  updateAbilities(dt);
  updateMapObjects(dt);

  // Check if human is dead — use lives system
  if (human && !human.alive && !human.isBot) {
    humanLives--;
    if (humanLives <= 0) {
      gameOver();
    } else {
      // Respawn with invincibility
      respawnPlayer(human);
      human._invincible = SPAWN_INVINCIBILITY;
      addKillNotif(`${humanLives} ${humanLives === 1 ? 'life' : 'lives'} remaining!`);
      updateLivesDisplay();
    }
  }
  countTerritory();

  // Update ability bar (throttled)
  if (!this._lastAbBarUpdate || performance.now() - this._lastAbBarUpdate > 250) {
    this._lastAbBarUpdate = performance.now();
    renderAbilityBar();
    if (shopOpen) renderShop();
  }
}

function processCell(p, cx, cy) {
  if (!inBounds(cx, cy) || !isInArena(cx, cy)) return;
  if (!p.alive) return;

  const onOwn = isOwn(p, cx, cy);
  const key = cellKey(cx, cy);

  if (!onOwn) {
    // Check trail collisions
    for (const other of players) {
      if (!other.alive) continue;
      if (other === p && !CONFIG.SELF_TRAIL_KILL) continue;
      if (other.trailSet.has(key)) {
        if (other === p) { killPlayer(p, null); }
        else { killPlayer(other, p); }
        return;
      }
    }
    if (!p.alive) return;

    // Head-on collision
    for (const other of players) {
      if (other === p || !other.alive) continue;
      if (other.cx === cx && other.cy === cy) {
        const pHome = isOwn(p, cx, cy);
        const oHome = isOwn(other, cx, cy);
        if (oHome && !pHome) { killPlayer(p, other); return; }
        if (pHome && !oHome) { killPlayer(other, p); return; }
        if (!pHome && !oHome) {
          if (p.territoryCount >= other.territoryCount) killPlayer(other, p);
          else killPlayer(p, other);
          return;
        }
      }
    }
    if (!p.alive) return;

    // Add to trail
    if (!p.trailSet.has(key)) {
      p.trail.push([cx, cy]);
      p.trailSet.add(key);
      if (p.trailPts.length === 0) p.trailPts.push({ x: p.x, y: p.y });
    }
  } else if (p.trail.length > 0) {
    // Returned to own territory — capture!
    captureTerritory(p);
  }
}

// ============================================================
// RENDER
// ============================================================
function rebuildTerritoryTex() {
  const img = terCtx2.createImageData(W, W);
  const d = img.data;
  const alpha = Math.round(CONFIG.TERRITORY_ALPHA * 255);
  for (let i = 0; i < W*W; i++) {
    const v = grid[i];
    if (v > 0 && v <= players.length) {
      const c = hexRgb(players[v-1].color);
      const idx = i*4;
      d[idx] = c.r; d[idx+1] = c.g; d[idx+2] = c.b; d[idx+3] = alpha;
    }
  }
  terCtx2.putImageData(img, 0, 0);
  terDirty = false;
}

function render() {
  const human = players[0];
  if (!human) return;

  // Smooth camera
  const t = 1 - Math.exp(-CONFIG.CAMERA_SPEED * (1/60));
  camX += (human.x - camX) * t;
  camY += (human.y - camY) * t;

  const z = CONFIG.ZOOM * UPGRADES.find(u => u.id === 'vision').effect(getUpgradeLevel('vision'));
  const hw = CONFIG.CANVAS_WIDTH / 2, hh = CONFIG.CANVAS_HEIGHT / 2;
  const offX = hw - camX * z;
  const offY = hh - camY * z;

  // Background
  ctx.fillStyle = CONFIG.BG_COLOR;
  ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

  // Arena circle (white paper)
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX * z + offX, CY * z + offY, R * z, 0, Math.PI * 2);
  ctx.fillStyle = CONFIG.ARENA_COLOR;
  ctx.fill();
  ctx.restore();

  // Clip to arena for territory + trails
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX * z + offX, CY * z + offY, R * z, 0, Math.PI * 2);
  ctx.clip();

  // Territory texture
  if (terDirty) rebuildTerritoryTex();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(terCvs, 0, 0, W, W, offX, offY, W * z, W * z);

  // Territory borders (crisp lines)
  const scx = Math.max(0, Math.floor(-offX / z));
  const ecx = Math.min(W, Math.ceil((CONFIG.CANVAS_WIDTH - offX) / z));
  const scy = Math.max(0, Math.floor(-offY / z));
  const ecy = Math.min(W, Math.ceil((CONFIG.CANVAS_HEIGHT - offY) / z));

  // Batch border segments per player
  const borderSegs = {};
  for (let y = scy; y < ecy; y++) {
    for (let x = scx; x < ecx; x++) {
      const v = getCell(x, y);
      if (v <= 0) continue;
      if (!borderSegs[v]) borderSegs[v] = [];
      const sx = x * z + offX, sy = y * z + offY;
      if (y === 0 || !inBounds(x,y-1) || getCell(x,y-1) !== v) borderSegs[v].push(sx,sy,sx+z,sy);
      if (y === W-1 || !inBounds(x,y+1) || getCell(x,y+1) !== v) borderSegs[v].push(sx,sy+z,sx+z,sy+z);
      if (x === 0 || !inBounds(x-1,y) || getCell(x-1,y) !== v) borderSegs[v].push(sx,sy,sx,sy+z);
      if (x === W-1 || !inBounds(x+1,y) || getCell(x+1,y) !== v) borderSegs[v].push(sx+z,sy,sx+z,sy+z);
    }
  }
  ctx.lineWidth = CONFIG.BORDER_WIDTH;
  for (const [id, segs] of Object.entries(borderSegs)) {
    const p = players[id - 1];
    if (!p) continue;
    ctx.strokeStyle = darken(p.color, CONFIG.BORDER_DARKEN);
    ctx.beginPath();
    for (let i = 0; i < segs.length; i += 4) {
      ctx.moveTo(segs[i], segs[i+1]);
      ctx.lineTo(segs[i+2], segs[i+3]);
    }
    ctx.stroke();
  }

  // Map objects (planets & asteroids)
  renderMapObjects(z, offX, offY);

  // Trails — smooth thick lines
  for (const p of players) {
    if (!p.alive || p.trailPts.length < 2) continue;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = z * CONFIG.TRAIL_WIDTH;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(p.trailPts[0].x * z + offX, p.trailPts[0].y * z + offY);
    for (let i = 1; i < p.trailPts.length; i++) {
      ctx.lineTo(p.trailPts[i].x * z + offX, p.trailPts[i].y * z + offY);
    }
    ctx.lineTo(p.x * z + offX, p.y * z + offY);
    ctx.stroke();
    // Glow
    ctx.globalAlpha = 0.15;
    ctx.lineWidth = z * CONFIG.TRAIL_WIDTH * 2.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Players — colored squares + alien face for human
  if (alienSpriteDirty) rebuildAlienSprite();

  // Render decoy if active
  if (activeEffects.decoy) {
    const dx = activeEffects.decoy.x * z + offX;
    const dy = activeEffects.decoy.y * z + offY;
    const dh = z * CONFIG.PLAYER_SIZE / 2;
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = players[0] ? players[0].color : '#999';
    roundRect(ctx, dx - dh, dy - dh, dh*2, dh*2, dh*0.25);
    ctx.fill();
    ctx.font = '8px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#999';
    ctx.fillText('🤖 Decoy', dx, dy - dh - 6);
    ctx.globalAlpha = 1;
  }

  for (const p of players) {
    if (!p.alive) continue;

    // Cloak makes human nearly invisible
    if (!p.isBot && activeEffects.cloak) ctx.globalAlpha = 0.15;

    const px = p.x * z + offX;
    const py = p.y * z + offY;
    const half = z * CONFIG.PLAYER_SIZE / 2;
    const r = half * 0.25;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    roundRect(ctx, px - half + 2, py - half + 2, half*2, half*2, r);
    ctx.fill();

    // Body
    ctx.fillStyle = p.color;
    roundRect(ctx, px - half, py - half, half*2, half*2, r);
    ctx.fill();
    ctx.strokeStyle = darken(p.color, 40);
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    roundRect(ctx, px - half + 1, py - half + 1, half * 1.4, half * 0.8, r * 0.8);
    ctx.fill();

    // Alien face on human player
    if (!p.isBot) {
      const faceSize = half * 2.6;
      ctx.drawImage(alienSprite, px - faceSize/2, py - faceSize/2 - half * 0.15, faceSize, faceSize);
    }

    // Shield bubble
    if (!p.isBot && activeEffects.shield) {
      ctx.beginPath();
      ctx.arc(px, py, half * 2.2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(75,200,255,0.6)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(75,200,255,0.08)';
      ctx.fill();
    }

    // Armor invincibility glow
    if (!p.isBot && p._invincible > 0) {
      ctx.beginPath();
      ctx.arc(px, py, half * 2.4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,215,0,${0.12 + 0.08 * Math.sin(performance.now() / 150)})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(255,215,0,${0.5 + 0.3 * Math.sin(performance.now() / 150)})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Spaceship boost ring
    if (!p.isBot && activeEffects.spaceship) {
      ctx.beginPath();
      ctx.arc(px, py, half * 1.8, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,200,50,0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Exhaust trail effect
      const ex = px - Math.cos(p.angle) * half * 2;
      const ey = py - Math.sin(p.angle) * half * 2;
      ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,150,0,0.6)'; ctx.fill();
      ctx.beginPath(); ctx.arc(ex - Math.cos(p.angle)*4, ey - Math.sin(p.angle)*4, 3, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,200,0,0.3)'; ctx.fill();
    }

    // Mining drill indicator
    if (!p.isBot && activeEffects.miner) {
      ctx.strokeStyle = 'rgba(200,120,50,0.5)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(px - z*1.5, py - z*1.5, z*3, z*3);
      ctx.setLineDash([]);
    }

    // Gravity well visual
    if (!p.isBot && activeEffects.gravity) {
      ctx.beginPath();
      ctx.arc(px, py, 15 * z, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(128,0,255,${0.2 + 0.1 * Math.sin(performance.now() / 200)})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Coin Doubler sparkle
    if (!p.isBot && activeEffects.magnet_item) {
      ctx.font = '10px sans-serif';
      ctx.fillText('×2', px + half + 4, py - half);
    }

    // Reset cloak alpha
    if (!p.isBot && activeEffects.cloak) ctx.globalAlpha = 1;
  }

  // Projectiles (missiles)
  for (const m of projectiles) {
    const mx = m.x * z + offX;
    const my = m.y * z + offY;
    // Missile body
    const a = Math.atan2(m.target.y - m.y, m.target.x - m.x);
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(a);
    ctx.fillStyle = '#FF4B5C';
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(-5, -4); ctx.lineTo(-3, 0); ctx.lineTo(-5, 4); ctx.closePath();
    ctx.fill();
    // Exhaust
    ctx.fillStyle = 'rgba(255,150,0,0.7)';
    ctx.beginPath(); ctx.arc(-6, 0, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,200,50,0.4)';
    ctx.beginPath(); ctx.arc(-10, 0, 2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // Tracking line to target
    const tx = m.target.x * z + offX;
    const ty = m.target.y * z + offY;
    ctx.strokeStyle = 'rgba(255,75,92,0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore(); // un-clip

  // Arena border
  ctx.beginPath();
  ctx.arc(CX * z + offX, CY * z + offY, R * z, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Player names + crown + Kardashev badge
  const arenaArea = countArenaArea();
  const leader = players.filter(p => p.alive).sort((a,b) => b.territoryCount - a.territoryCount)[0];
  for (const p of players) {
    if (!p.alive) continue;
    const px = p.x * z + offX;
    const py = p.y * z + offY;
    const half = z * CONFIG.PLAYER_SIZE / 2;
    const pa = planetAssignments[p.index];
    const pctP = arenaArea > 0 ? (p.territoryCount / arenaArea) * 100 : 0;
    const tier = getKardashev(pctP);

    // Kardashev badge background
    const badgeText = tier.label;
    ctx.font = 'bold 8px sans-serif';
    const bw = ctx.measureText(badgeText).width + 8;
    const badgeY = py - half - 22;
    ctx.fillStyle = tier.color;
    roundRect(ctx, px - bw/2, badgeY - 8, bw, 12, 3);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.fillText(badgeText, px, badgeY + 1);

    // Planet icon + name
    ctx.font = 'bold 11px sans-serif';
    ctx.fillStyle = '#333';
    const nameY = py - half - 7;
    const planetIcon = pa ? PLANETS[pa.planet].icon + ' ' : '';
    ctx.fillText(planetIcon + p.name, px, nameY);

    // Crown for leader
    if (p === leader && p.territoryCount > 0) {
      ctx.font = '10px sans-serif';
      ctx.fillText('\u{1F451}', px, badgeY - 10);
    }
  }

  // UI: Score + Kardashev
  const humanPct = human.alive ? (human.territoryCount / arenaArea) * 100 : 0;
  const humanTier = getKardashev(humanPct);
  const humanPa = planetAssignments[0];
  const humanEvo = humanPa ? getEvoStage(humanPa.species, humanPct) : null;
  let scoreText = humanPct.toFixed(1) + '% \u2022 ' + humanTier.label;
  if (humanEvo) scoreText += ' \u2022 ' + humanEvo.name;
  document.getElementById('score').textContent = scoreText;

  // Leaderboard with Kardashev
  const sorted = [...players].filter(p => p.alive).sort((a,b) => b.territoryCount - a.territoryCount);
  const lbHtml = sorted.slice(0, 6).map((p, i) => {
    const pctVal = ((p.territoryCount / arenaArea) * 100);
    const t = getKardashev(pctVal);
    const bold = p === human ? 'font-weight:bold' : '';
    const crown = i === 0 && p.territoryCount > 0 ? '<span class="lb-crown">\u{1F451}</span>' : '';
    return `<div class="lb-entry" style="${bold}">
      <span class="lb-name"><span class="lb-color" style="background:${p.color}"></span>${crown}${p.name}</span>
      <span style="color:${t.color};font-size:10px;margin-right:4px">${t.label}</span>
      <span>${pctVal.toFixed(1)}%</span>
    </div>`;
  }).join('');
  document.getElementById('lb-entries').innerHTML = lbHtml;

  // Update evo tree panel (throttled)
  if (evoTreeOpen && (!this._lastEvoUpdate || performance.now() - this._lastEvoUpdate > 500)) {
    this._lastEvoUpdate = performance.now();
    updateEvoTree();
  }

  // Minimap (throttled to ~15fps)
  if (minimapVisible && (!this._lastMinimap || performance.now() - this._lastMinimap > 66)) {
    this._lastMinimap = performance.now();
    renderMinimap();
  }
}

let _arenaArea = 0;
function countArenaArea() {
  if (_arenaArea > 0) return _arenaArea;
  let c = 0;
  for (let i = 0; i < W*W; i++) if (grid[i] !== -1) c++;
  _arenaArea = c;
  return c;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================================================
// GAME LOOP
// ============================================================
function gameLoop(ts) {
  if (!gameRunning) return;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if (!gamePausedForUI) update(dt);
  render();
  animFrame = requestAnimationFrame(gameLoop);
}

// ============================================================
// INIT / START / GAME OVER
// ============================================================
function initGame() {
  grid = new Int8Array(W * W);
  // Mark cells outside arena as wall
  for (let y = 0; y < W; y++) {
    for (let x = 0; x < W; x++) {
      grid[y*W+x] = isInArena(x, y) ? 0 : -1;
    }
  }
  players = [];
  _arenaArea = 0;
  spawnMapObjects();
  assignPlanetsAndSpecies();

  // Human — use profile
  players.push(createPlayer(0, profile.name, false, profile.colorIndex));
  // Bots
  for (let i = 0; i < CONFIG.BOT_COUNT; i++) {
    players.push(createPlayer(i + 1, CONFIG.BOT_NAMES[i % CONFIG.BOT_NAMES.length], true));
  }

  camX = players[0].x; camY = players[0].y;
  players[0]._invincible = SPAWN_INVINCIBILITY; // spawn protection
  countTerritory();
  terDirty = true;
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  closeProfile();
  closeShop();
  closeUpgrades();
  closeEvo();
  gamePausedForUI = false;
  roundCoinsStart = profile.coins;
  roundSurvivalTime = 0;
  humanLives = HUMAN_MAX_LIVES;
  alienSpriteDirty = true;
  // Reset abilities
  inventory = {};
  activeEffects = {};
  projectiles = [];
  cooldowns = {};
  renderAbilityBar();
  updateLivesDisplay();
  initGame();
  gameRunning = true;
  lastTime = performance.now();
  animFrame = requestAnimationFrame(gameLoop);
}

let roundCoinsStart = 0;
let roundSurvivalTime = 0;
let humanLives = 3;
const HUMAN_MAX_LIVES = 3;
const SPAWN_INVINCIBILITY = 2.5; // seconds of invincibility on spawn/respawn

function gameOver() {
  gameRunning = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  const arenaArea = countArenaArea();
  const human = players[0];
  const pct = ((human.territoryCount / arenaArea) * 100);

  // End-of-round bonus coins
  const territoryBonus = Math.floor(pct * 2);         // 2 coins per 1% territory held
  const killBonus = human.kills * 15;                  // 15 coins per kill bonus
  const survivalBonus = Math.floor(roundSurvivalTime / 10) * 5; // 5 coins per 10s survived
  const roundBonus = territoryBonus + killBonus + survivalBonus;
  if (roundBonus > 0) addCoins(roundBonus);

  const earned = profile.coins - roundCoinsStart;
  const overlay = document.getElementById('overlay');
  overlay.querySelector('h1').textContent = 'Game Over';
  overlay.querySelector('p').innerHTML = `${pct.toFixed(1)}% captured \u2022 ${human.kills} kill${human.kills !== 1 ? 's' : ''}<br>` +
    `<span style="font-size:14px;color:#FFA500;font-weight:bold">+${earned} coins</span>` +
    `<br><span style="font-size:11px;opacity:0.6">Territory +${territoryBonus} \u2022 Kills +${killBonus} \u2022 Survival +${survivalBonus}</span>`;
  overlay.querySelector('button').textContent = 'Play Again';
  overlay.style.display = 'flex';
}

document.getElementById('startBtn').addEventListener('click', startGame);

// Init coin display + ability bar on load
updateCoinDisplay();
renderAbilityBar();
</script>
